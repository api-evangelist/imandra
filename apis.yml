aid: imandra
name: Imandra
description: >-
  Imandra Inc. delivers Reasoning as a Service — combining artificial
  intelligence with formal verification and automated reasoning. Its
  neurosymbolic platform builds mathematical models of software so that AI
  systems can understand, verify, and justify code behavior, prove correctness,
  and uncover hidden bugs. Core products include ImandraX, a cloud-native
  automated reasoning engine and theorem prover exposed over a protobuf/gRPC
  API; CodeLogician, an AI coding agent (with CLI and MCP server) that
  formalizes source code and reasons about it; IPL (Imandra Protocol Language)
  for modeling financial messaging protocols; and SpecLogician, which converts
  natural language into formal models. The tools are delivered through the
  hosted Imandra Universe platform and target financial infrastructure,
  autonomous workflows, and regulated industries where trustworthy, explainable
  AI reasoning is critical.
