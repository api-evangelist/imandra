apis:
- name: ImandraX API
  description: >-
    The ImandraX cloud-native automated reasoning engine, exposed as a
    protobuf-defined gRPC API. Services include Eval (evaluate code snippets,
    parse terms/types, manage artifacts), Simple (verify, test, qcheck,
    instance-find, decompose, typecheck, oneshot), SessionManager (stateful
    reasoning sessions), and System (version and memory management). An HTTP API
    client is also published for OCaml.
