transport:
  primary: gRPC / protobuf
  note: >-
    The ImandraX API is defined in protobuf (see grpc/) and served over gRPC.
    A REST/HTTP surface is also provided (imandra-http-api-client). The hosted
    Imandra Universe platform additionally exposes agent workflows and an MCP
    server.
authentication:
